name: Daily London Blue Topaz Chatbot Answer

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:00 Asia/Kolkata (02:30 UTC)
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: london-blue-topaz-answer
  cancel-in-progress: false

jobs:
  ask-and-save:
    name: Ask once and save the chatbot answer
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask the model with built-in web search
        id: ask
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          question = "Where can I buy a London blue topaz ring? I'm shopping in the USA."
          if not os.environ.get("OPENAI_API_KEY"):
              print("Missing repository secret OPENAI_API_KEY", file=sys.stderr)
              sys.exit(1)

          payload = {
              "model": "gpt-4.1",
              "store": False,
              "tools": [{"type": "web_search"}],
              "input": [
                  {
                      "role": "user",
                      "content": [
                          {
                              "type": "input_text",
                              "text": (
                                  "Answer this exact question as a helpful shopping assistant. "
                                  "Use the built-in web search when appropriate. Treat this as a "
                                  "brand-new, independent conversation with no prior chat history. "
                                  "Give a natural answer with useful retailer/product links and "
                                  "prices only when supported by your findings.\n\n"
                                  + question
                              )
                          }
                      ]
                  }
              ]
          }

          body = json.dumps(payload).encode("utf-8")
          last_error = None
          for attempt in range(3):
              req = urllib.request.Request(
                  "https://api.openai.com/v1/responses",
                  data=body,
                  headers={
                      "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")[:1500]
                  last_error = f"OpenAI API HTTP {e.code}: {detail}"
                  if e.code not in (408, 429, 500, 502, 503, 504) or attempt == 2:
                      print(last_error, file=sys.stderr)
                      sys.exit(1)
              except (urllib.error.URLError, TimeoutError) as e:
                  last_error = str(e)
                  if attempt == 2:
                      print(f"OpenAI API request failed after retries: {last_error}", file=sys.stderr)
                      sys.exit(1)
              time.sleep(2 ** attempt)
          else:
              print(last_error or "OpenAI API request failed", file=sys.stderr)
              sys.exit(1)

          chunks = []
          for item in result.get("output", []):
              if item.get("type") != "message":
                  continue
              for block in item.get("content", []):
                  if block.get("type") == "output_text" and isinstance(block.get("text"), str):
                      chunks.append(block["text"])
          answer = "\n".join(chunks).strip()
          if not answer:
              print("The model returned no answer text; refusing to save an empty result.", file=sys.stderr)
              print(json.dumps(result, ensure_ascii=False)[:4000], file=sys.stderr)
              sys.exit(1)

          now = datetime.now(timezone.utc)
          date = now.strftime("%Y-%m-%d")
          timestamp = now.strftime("%Y-%m-%d %H:%M:%S UTC")
          path = f"results/{date}/london-blue-topaz-ring.md"
          os.makedirs(os.path.dirname(path), exist_ok=True)

          # Store a small metadata header, then the model's answer text without rewriting it.
          with open(path, "w", encoding="utf-8") as f:
              f.write(f"<!-- Captured: {timestamp} -->\n")
              f.write(f"<!-- Exact question: {question} -->\n\n")
              f.write(answer)
              f.write("\n")

          print(f"Saved chatbot answer to {path}")
          print(f"Answer length: {len(answer)} characters")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"path={path}\n")
          PY

      - name: Commit answer if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.ask.outputs.path }}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Answer file has not changed; no commit needed."
            exit 0
          fi
          git commit -m "Save daily London blue topaz chatbot answer"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo "Failed to push answer after three attempts." >&2
          exit 1

      - name: Summarize run
        if: always()
        env:
          ANSWER_PATH: ${{ steps.ask.outputs.path }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          {
            echo "## Daily London Blue Topaz Answer"
            echo "- Question: Where can I buy a London blue topaz ring? I'm shopping in the USA."
            echo "- Saved file: ${ANSWER_PATH:-not created}"
            echo "- Changed and committed: ${CHANGED:-no}"
            if [ -n "$COMMIT_SHA" ]; then echo "- Commit: $COMMIT_SHA"; fi
          } >> "$GITHUB_STEP_SUMMARY"
